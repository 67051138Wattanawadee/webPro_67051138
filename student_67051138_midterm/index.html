<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Smart Event Hub</h1>
        <nav>
            <button id="themeMode">Dark Mode</button>
            <button id="addNewActivities" type="button">+ เพิ่มกิจกรรมใหม่</button>
        </nav>
    </header>
    <main>
        <aside>
            <h2>สถิติภาพรวม</h2>
            <p>กิจกรรมทั้งหมด: <span id="totalActivities">0</span></p>
            <p>ลงทะเบียนแล้ว: <span id="alreadyEnrolled">0</span></p>
            <p>ที่นั่งว่างรวม: <span id="totalAvailableSeats">0</span></p>
            <!-- <span id="totalActivities">กิจกรรมทั้งหมด: </span> <br>
            <span id="alreadyEnrolled">ลงทะเบียนแล้ว: </span> <br>
            <span id="totalAvailableSeats">ที่นั่งว่างรวม: </span> -->
        </aside>
        
        <section> 
            <h2>ค้นหาและกรองข้อมูล</h2>
            <form id="filterForm">
                <div>
                <label for="searching">ค้นหากิจกรรม / วิทยากร:</label>
                <input type="text" id="searching" placeholder="พิมพ์คำค้นหา...">
                </div>
                <div>
                    <label for="activitiesType">ประเภทกิจกรรม:</label>
                    <select id="activitiesType" class="input-field">
                        <option value="All">ทั้งหมด (All)</option>
                        <option value="Tech">Tech</option>
                        <option value="Design">Design</option>
                        <option value="Business">Business</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div>
                    <label for="activitiesDate">เรียงลำดับตาม:</label>
                    <select id="activitiesDate" class="input-field">
                        <option value="dateIncreasing">วันที่ (น้อยไปมาก)</option>
                        <option value="dateDecreasing">วันที่ (มากไปน้อย)</option>
                        <option value="seatsIncreasing">ที่นั่งว่าง (น้อยไปมาก)</option>
                        <option value="seatsDecreasing">ที่นั่งว่าง (มากไปน้อย)</option>
                    </select>
                </div>
                <button type="button" id="setToDefault">คืนค่าข้อมูลเริ่มต้น</button>
            </form>
        </section>

        <section>
            <h2>รายการกิจกรรมและเวิร์กช็อป</h2>
            <div id="eventList">

            </div>
        </section>

        <section id="addEventSection" style="display: none;">
            <h3>เพิ่มกิจกรรมใหม่ (Admin Only)</h3>
            <form id="addEvent">
                <div>
                    <label for="title">ชื่อกิจกรรม *</label>
                    <input type="text" id="title" required>
                </div>
                <div>
                    <label for="activitiesCategory">ประเภท *</label>
                    <select id="activitiesCategory" class="input-field">
                        <option value="AllCategory">ทั้งหมด (All)</option>
                        <option value="Tech">Tech</option>
                        <option value="Design">Design</option>
                        <option value="Business">Business</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div>
                    <label for="speakerName">วิทยากร *</label>
                    <input type="text" id="speakerName" required>
                </div>
                <div>
                    <label for="date">วันที่จัดงาน *</label>
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label for="seats">จำนวนที่นั่งเปิดรับ *</label>
                    <input type="number" id="seats" min="1" required>
                </div>
                <div>
                    <label for="description">รายละเอียดกิจกรรม *</label> <br>
                    <textarea id="description" required></textarea>
                </div>
                <div>
                    <button type="button" id="cancledActivities">ยกเลิก</button>
                    <button type="submit">บันทึกกิจกรรม</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CS Midterm Examination - Web Programming</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
